name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Lint needs only the tools, not the whole OCR stack.
      - run: pip install ruff==0.15.22 black==26.5.1
      - run: ruff check backend/app
      - run: black --check backend/app

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fake values only: tests run on the in-process fake Mongo and a *_test database name.
      MONGO_DB_NAME: ci_test
      JWT_SECRET: ci-only-fake-secret-0123456789abcdef0123456789
      GROQ_API_KEYS: ci-fake-key
      CHECK_INSTALLED_PINS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # The app imports PaddleOCR at start-up, so the tests need the full runtime pins.
      - run: pip install -r requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: >
          pytest app/core app/features/auth app/features/admin app/features/chat
          app/features/documents app/features/ocr -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test $(find src -name "*.test.js")

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test $(find src -name "*.test.js")
